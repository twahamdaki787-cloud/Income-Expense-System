<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income & Expense Management System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            padding: 20px;
            border-radius: 8px;
            color: #fff;
            text-align: center;
        }

        .card h3 {
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .card p {
            font-size: 22px;
            font-weight: bold;
        }

        .balance { background-color: #2980b9; }
        .income { background-color: #27ae60; }
        .expense { background-color: #c0392b; }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }

        form input, form select, form button {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        form input[type="text"] { flex: 2; min-width: 150px; }
        form input[type="number"] { flex: 1; min-width: 100px; }
        form select { flex: 1; min-width: 120px; }

        form button {
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            min-width: 100px;
            transition: background 0.3s;
        }

        form button:hover {
            background-color: #1a252f;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #555;
        }

        .type-income { color: #27ae60; font-weight: bold; }
        .type-expense { color: #c0392b; font-weight: bold; }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Income & Expense Tracker</h1>

    <!-- Dashboard Cards -->
    <div class="dashboard">
        <div class="card balance">
            <h3>Net Balance</h3>
            <p id="total-balance">TSH 0</p>
        </div>
        <div class="card income">
            <h3>Total Income</h3>
            <p id="total-income">TSH 0</p>
        </div>
        <div class="card expense">
            <h3>Total Expense</h3>
            <p id="total-expense">TSH 0</p>
        </div>
    </div>

    <!-- Transaction Form -->
    <form id="transaction-form">
        <input type="text" id="desc" placeholder="Description (e.g. Salary, Rent)" required>
        <input type="number" id="amount" placeholder="Amount (TSH)" required min="1">
        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>
        <button type="submit">Add</button>
    </form>

    <!-- Transactions Table -->
    <h2>Transaction History</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="transaction-list">
                <!-- Transactions will appear here dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const balanceEl = document.getElementById('total-balance');
    const incomeEl = document.getElementById('total-income');
    const expenseEl = document.getElementById('total-expense');
    const form = document.getElementById('transaction-form');
    const descInput = document.getElementById('desc');
    const amountInput = document.getElementById('amount');
    const typeInput = document.getElementById('type');
    const listEl = document.getElementById('transaction-list');

    // Get transactions from LocalStorage
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    function updateUI() {
        listEl.innerHTML = '';
        
        let income = 0;
        let expense = 0;

        transactions.forEach((item, index) => {
            const row = document.createElement('tr');
            
            if(item.type === 'income') {
                income += item.amount;
            } else {
                expense += item.amount;
            }

            row.innerHTML = `
                <td>${item.desc}</td>
                <td class="${item.type === 'income' ? 'type-income' : 'type-expense'}">
                    ${item.type.toUpperCase()}
                </td>
                <td>TSH ${item.amount.toLocaleString()}</td>
                <td><button class="btn-delete" onclick="deleteTransaction(${index})">Delete</button></td>
            `;

            listEl.appendChild(row);
        });

        const balance = income - expense;

        balanceEl.innerText = `TSH ${balance.toLocaleString()}`;
        incomeEl.innerText = `TSH ${income.toLocaleString()}`;
        expenseEl.innerText = `TSH ${expense.toLocaleString()}`;

        localStorage.setItem('transactions', JSON.stringify(transactions));
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const newTransaction = {
            desc: descInput.value,
            amount: parseFloat(amountInput.value),
            type: typeInput.value
        };

        transactions.push(newTransaction);
        updateUI();

        descInput.value = '';
        amountInput.value = '';
    });

    function deleteTransaction(index) {
        transactions.splice(index, 1);
        updateUI();
    }

    // Initial call
    updateUI();
</script>

</body>
              </html>
